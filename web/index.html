<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miks Family Tree</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
</head>
<body>

  <!-- Tree view -->
  <div id="tree-view">
    <svg id="treeSvg"></svg>
  </div>

  <!-- Map view (hidden initially) -->
  <div id="map-view">
    <div id="map-sidebar">
      <input type="text" id="map-search" placeholder="Search by name…" autocomplete="off" />
      <h2 id="map-sidebar-title">Click a continent</h2>
      <button id="map-back-btn">← World</button>
      <ul id="map-people-list"></ul>
    </div>
    <div id="map-canvas">
      <svg id="mapSvg"></svg>
    </div>
    <div id="map-person-card" class="map-person-card" hidden>
      <button id="map-person-card-close" class="map-person-card-close" aria-label="Close">&times;</button>
      <h2 id="mpc-name" class="map-person-card-name"></h2>
      <img id="mpc-photo" class="map-person-card-photo" src="" alt="" />
      <p id="mpc-location" class="map-person-card-location"></p>
      <p id="mpc-places-lived" class="map-person-card-places-lived"></p>
      <p id="mpc-blurb" class="map-person-card-blurb"></p>
    </div>
  </div>

  <!-- Toggle button: fixed bottom right -->
  <div class="view-toggle">
    <button id="btn-tree" class="toggle-btn active">Tree</button>
    <button id="btn-map"  class="toggle-btn">Map</button>
  </div>

  <script src="./js/app.js"></script>
  <script src="./js/map.js"></script>
</body>
</html>
