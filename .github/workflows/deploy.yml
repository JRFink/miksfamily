name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        run: GOOS=linux GOARCH=amd64 go build -o miksfamily main.go

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: miksfamily-binary
          path: miksfamily
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: miksfamily-binary
          path: ./

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Copy binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MIKSFAMILY_HOST }}
          username: ${{ secrets.MIKSFAMILY_USER }}
          key: ${{ secrets.MIKSFAMILY_SSH_KEY }}
          source: "miksfamily"
          target: "/tmp/"

      - name: Copy web folder to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MIKSFAMILY_HOST }}
          username: ${{ secrets.MIKSFAMILY_USER }}
          key: ${{ secrets.MIKSFAMILY_SSH_KEY }}
          source: "repo/web"
          target: "/tmp/"
          strip_components: 1

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MIKSFAMILY_HOST }}
          username: ${{ secrets.MIKSFAMILY_USER }}
          key: ${{ secrets.MIKSFAMILY_SSH_KEY }}
          script: |
            set -e
            chmod +x /tmp/miksfamily
            mv /tmp/miksfamily /home/ubuntu/miksfamily/miksfamily
            rm -rf /home/ubuntu/miksfamily/web
            mv /tmp/web /home/ubuntu/miksfamily/web
            sudo systemctl restart miksfamily
            sleep 2
            sudo systemctl is-active miksfamily
